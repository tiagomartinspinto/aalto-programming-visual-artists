<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-labelledby="cc-title cc-desc">
  <title id="cc-title">The canvas coordinate system</title>
  <desc id="cc-desc">A square canvas with its origin at the top-left corner, labeled (0, 0). The x axis increases to the right along the top edge. The y axis increases downward along the left edge. An example point at (250, 150) is plotted inside, closer to the top than the bottom.</desc>
  <style>
    text { font-family: "Courier New", Consolas, "Liberation Mono", monospace; fill: #000000; }
  </style>

  <!-- canvas box -->
  <rect x="90" y="70" width="300" height="260" fill="#ffffff" stroke="#000000" stroke-width="3"/>

  <!-- x axis arrow, above the box -->
  <line x1="90" y1="40" x2="365" y2="40" stroke="#000000" stroke-width="2.5"/>
  <polygon points="365,40 353,34 353,46" fill="#000000"/>
  <text x="90" y="26" font-size="17" font-weight="bold">x increases &#8594;</text>

  <!-- y axis arrow, left of the box -->
  <line x1="55" y1="70" x2="55" y2="345" stroke="#000000" stroke-width="2.5"/>
  <polygon points="55,345 49,333 61,333" fill="#000000"/>
  <text x="30" y="207" font-size="17" font-weight="bold" text-anchor="middle" transform="rotate(-90 30 207)">y increases (downward)</text>

  <!-- origin -->
  <circle cx="90" cy="70" r="5" fill="#000000"/>
  <text x="100" y="95" font-size="16" font-weight="bold">(0, 0)</text>

  <!-- example point at roughly 62% across, 42% down the box -->
  <line x1="90" y1="179" x2="276" y2="179" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="276" y1="70" x2="276" y2="179" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,5"/>
  <circle cx="276" cy="179" r="6" fill="#000000"/>
  <text x="286" y="175" font-size="16" font-weight="bold">(250, 150)</text>

  <!-- width / height labels -->
  <text x="200" y="358" font-size="14">width</text>
  <text x="404" y="205" font-size="14" transform="rotate(90 404 205)">height</text>
</svg>
