<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-labelledby="mr-title mr-desc">
  <title id="mr-title">map() turns one range into another</title>
  <desc id="mr-desc">mouseX ranges from 0 to width. map() converts it into a value from 0 to 255. A mouse position about halfway across the input range produces an output about halfway across the output range.</desc>
  <style>
    text { font-family: "Courier New", Consolas, "Liberation Mono", monospace; fill: #000000; }
  </style>

  <!-- input bar: mouseX, 0 to width -->
  <text x="40" y="30" font-size="16" font-weight="bold">mouseX</text>
  <line x1="40" y1="55" x2="440" y2="55" stroke="#000000" stroke-width="3"/>
  <line x1="40" y1="45" x2="40" y2="65" stroke="#000000" stroke-width="3"/>
  <line x1="440" y1="45" x2="440" y2="65" stroke="#000000" stroke-width="3"/>
  <text x="34" y="82" font-size="14">0</text>
  <text x="418" y="82" font-size="14">width</text>
  <circle cx="240" cy="55" r="6" fill="#000000"/>
  <text x="200" y="105" font-size="14">about halfway across</text>

  <!-- map() label with arrow -->
  <line x1="240" y1="120" x2="240" y2="150" stroke="#000000" stroke-width="2.5"/>
  <polygon points="240,150 234,138 246,138" fill="#000000"/>
  <text x="255" y="140" font-size="16" font-weight="bold">map()</text>

  <!-- output bar: 0 to 255 -->
  <text x="40" y="180" font-size="16" font-weight="bold">color value</text>
  <line x1="40" y1="205" x2="440" y2="205" stroke="#000000" stroke-width="3"/>
  <line x1="40" y1="195" x2="40" y2="215" stroke="#000000" stroke-width="3"/>
  <line x1="440" y1="195" x2="440" y2="215" stroke="#000000" stroke-width="3"/>
  <text x="34" y="232" font-size="14">0</text>
  <text x="412" y="232" font-size="14">255</text>
  <circle cx="240" cy="205" r="6" fill="#000000"/>
  <text x="188" y="255" font-size="14">about halfway across too</text>
</svg>
