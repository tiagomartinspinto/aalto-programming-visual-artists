<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" role="img" aria-labelledby="pl-title pl-desc">
  <title id="pl-title">One Particle, the particles array, and its lifecycle</title>
  <desc id="pl-desc">class Particle is the recipe for one particle, holding its own x, y, speedX, speedY, and life. The particles array holds many separate Particle objects built from that recipe. Below, the lifecycle: a new particle is created, pushed into the array, updated and displayed every frame, and finally removed from the array once its life reaches zero.</desc>
  <style>
    text { font-family: "Courier New", Consolas, "Liberation Mono", monospace; fill: #000000; }
  </style>

  <!-- Part A: one Particle vs the array -->
  <rect x="30" y="30" width="180" height="70" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <text x="40" y="50" font-size="13" font-weight="bold">class Particle</text>
  <text x="40" y="70" font-size="12">x, y, speedX, speedY,</text>
  <text x="40" y="86" font-size="12">life</text>
  <text x="40" y="114" font-size="12">recipe for one particle</text>

  <text x="290" y="25" font-size="13" font-weight="bold">particles[ ]</text>
  <circle cx="290" cy="55" r="16" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <circle cx="330" cy="55" r="16" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <circle cx="370" cy="55" r="16" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <circle cx="410" cy="55" r="16" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <text x="270" y="114" font-size="12">holds many Particle objects</text>

  <line x1="210" y1="60" x2="270" y2="55" stroke="#000000" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- divider -->
  <line x1="20" y1="135" x2="460" y2="135" stroke="#000000" stroke-width="1.5"/>

  <!-- Part B: lifecycle -->
  <rect x="50" y="150" width="380" height="34" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <text x="240" y="171" font-size="13" text-anchor="middle">create new Particle(x, y)</text>
  <line x1="240" y1="184" x2="240" y2="200" stroke="#000000" stroke-width="2"/>
  <polygon points="240,204 234,193 246,193" fill="#000000"/>

  <rect x="50" y="204" width="380" height="34" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <text x="240" y="225" font-size="13" text-anchor="middle">push into particles[ ]</text>
  <line x1="240" y1="238" x2="240" y2="254" stroke="#000000" stroke-width="2"/>
  <polygon points="240,258 234,247 246,247" fill="#000000"/>

  <rect x="50" y="258" width="380" height="34" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <text x="240" y="279" font-size="13" text-anchor="middle">update(): move, life -= amount</text>
  <line x1="240" y1="292" x2="240" y2="308" stroke="#000000" stroke-width="2"/>
  <polygon points="240,312 234,301 246,301" fill="#000000"/>

  <rect x="50" y="312" width="380" height="34" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <text x="240" y="333" font-size="13" text-anchor="middle">display(): draw at current position</text>
  <line x1="240" y1="346" x2="240" y2="362" stroke="#000000" stroke-width="2"/>
  <polygon points="240,366 234,355 246,355" fill="#000000"/>

  <rect x="50" y="366" width="380" height="34" fill="#ffffff" stroke="#000000" stroke-width="2.5" stroke-dasharray="7,4"/>
  <text x="240" y="387" font-size="13" text-anchor="middle">life &#8804; 0 &#8594; removed from particles[ ]</text>
</svg>
