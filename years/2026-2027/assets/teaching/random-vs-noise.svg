<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="rn-title rn-desc">
  <title id="rn-title">random() versus noise()</title>
  <desc id="rn-desc">Two rows of ten bars sampled left to right. In the random() row, neighboring bars jump to unrelated heights. In the noise() row, neighboring bars stay close in height, rising and falling smoothly.</desc>
  <style>
    text { font-family: "Courier New", Consolas, "Liberation Mono", monospace; fill: #000000; }
  </style>

  <!-- random() row -->
  <text x="40" y="24" font-size="16" font-weight="bold">random()</text>
  <line x1="40" y1="110" x2="462" y2="110" stroke="#000000" stroke-width="2"/>
  <g fill="#ffffff" stroke="#000000" stroke-width="2">
    <rect x="40"  y="98"  width="35" height="12"/>
    <rect x="83"  y="52"  width="35" height="58"/>
    <rect x="126" y="92"  width="35" height="18"/>
    <rect x="169" y="60"  width="35" height="50"/>
    <rect x="212" y="102" width="35" height="8"/>
    <rect x="255" y="45"  width="35" height="65"/>
    <rect x="298" y="88"  width="35" height="22"/>
    <rect x="341" y="105" width="35" height="5"/>
    <rect x="384" y="58"  width="35" height="52"/>
    <rect x="427" y="82"  width="35" height="28"/>
  </g>
  <text x="40" y="132" font-size="13">neighboring samples jump independently</text>

  <!-- noise() row -->
  <text x="40" y="174" font-size="16" font-weight="bold">noise()</text>
  <line x1="40" y1="260" x2="462" y2="260" stroke="#000000" stroke-width="2"/>
  <g fill="#ffffff" stroke="#000000" stroke-width="2">
    <rect x="40"  y="242" width="35" height="18"/>
    <rect x="83"  y="234" width="35" height="26"/>
    <rect x="126" y="226" width="35" height="34"/>
    <rect x="169" y="216" width="35" height="44"/>
    <rect x="212" y="208" width="35" height="52"/>
    <rect x="255" y="202" width="35" height="58"/>
    <rect x="298" y="206" width="35" height="54"/>
    <rect x="341" y="216" width="35" height="44"/>
    <rect x="384" y="228" width="35" height="32"/>
    <rect x="427" y="238" width="35" height="22"/>
  </g>
  <text x="40" y="282" font-size="13">neighboring samples change smoothly</text>
</svg>
