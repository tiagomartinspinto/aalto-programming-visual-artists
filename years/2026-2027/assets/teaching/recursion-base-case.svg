<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-labelledby="rb-title rb-desc">
  <title id="rb-title">branch() calls itself, then stops</title>
  <desc id="rb-desc">A trunk labeled branch 100 splits into two branches labeled branch 70. Each of those splits into two more branches labeled branch 49. Each of those makes one final short branch labeled 34, marked with an open circle where it stops instead of splitting again, because it has become too small to continue.</desc>
  <style>
    text { font-family: "Courier New", Consolas, "Liberation Mono", monospace; fill: #000000; }
  </style>

  <!-- level 0: trunk, length "100" -->
  <line x1="240" y1="340" x2="240" y2="270" stroke="#000000" stroke-width="4"/>
  <text x="248" y="315" font-size="13">branch(100)</text>

  <!-- level 1: two branches, length "70" -->
  <line x1="240" y1="270" x2="170" y2="210" stroke="#000000" stroke-width="3.5"/>
  <line x1="240" y1="270" x2="310" y2="210" stroke="#000000" stroke-width="3.5"/>
  <text x="130" y="245" font-size="12">branch(70)</text>
  <text x="315" y="245" font-size="12">branch(70)</text>

  <!-- level 2: four branches, length "49" -->
  <line x1="170" y1="210" x2="130" y2="165" stroke="#000000" stroke-width="3"/>
  <line x1="170" y1="210" x2="200" y2="165" stroke="#000000" stroke-width="3"/>
  <line x1="310" y1="210" x2="280" y2="165" stroke="#000000" stroke-width="3"/>
  <line x1="310" y1="210" x2="350" y2="165" stroke="#000000" stroke-width="3"/>
  <text x="340" y="195" font-size="12">branch(49)</text>

  <!-- level 3: one short stub per level-2 tip, then stop -->
  <line x1="130" y1="165" x2="122" y2="140" stroke="#000000" stroke-width="2.5"/>
  <line x1="200" y1="165" x2="208" y2="140" stroke="#000000" stroke-width="2.5"/>
  <line x1="280" y1="165" x2="272" y2="140" stroke="#000000" stroke-width="2.5"/>
  <line x1="350" y1="165" x2="358" y2="140" stroke="#000000" stroke-width="2.5"/>
  <circle cx="122" cy="140" r="5" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <circle cx="208" cy="140" r="5" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <circle cx="272" cy="140" r="5" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <circle cx="358" cy="140" r="5" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <text x="215" y="118" font-size="13" font-weight="bold" text-anchor="middle">branch(34): too small &#8594; stop</text>

  <!-- summary line -->
  <rect x="10" y="352" width="460" height="34" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="20" y="374" font-size="13">length shrinks each call: 100 &#8594; 70 &#8594; 49 &#8594; 34 &#8594; stop</text>
</svg>
